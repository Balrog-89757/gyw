<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>个人中心 - 在线智能音乐盒</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link rel="stylesheet" th:href="@{/layuiadmin/layui/css/layui.css}" media="all">
    <link rel="stylesheet" th:href="@{/layuiadmin/style/admin.css}" media="all">
    <script>
        /^http(s*):\/\//.test(location.href) || alert('请先部署到 localhost 下再访问');
    </script>
</head>
<body class="layui-layout-body">

<div id="LAY_app">
    <div class="layui-layout layui-layout-admin">
        <!-- ===== 引入头部区域（来自 contentTop） ===== -->
        <div th:replace="contentTop :: top"></div>

        <!-- ===== 侧边菜单 ===== -->
        <div class="layui-side layui-side-menu">
            <div class="layui-side-scroll">
                <div class="layui-logo" lay-href="home/console.html">
                    <span>🎵 个人中心</span>
                </div>
                <!-- 通过后台数据生成菜单（普通用户的 userMenuList） -->
                <ul class="layui-nav layui-nav-tree" lay-shrink="all" lay-filter="layadmin-system-side-menu">
                    <li class="layui-nav-item" th:each="menu1 : ${userMenuList}">
                        <a href="javascript:;" th:lay-tips="${menu1.title}" lay-direction="2">
                            <i th:class="${menu1.iconClass}"></i>
                            <cite th:text="${menu1.title}"></cite>
                        </a>
                        <dl class="layui-nav-child" th:if="${menu1.child != null}">
                            <dd th:each="menu2 : ${menu1.childMenuList}">
                                <i th:class="${menu2.iconClass}"></i>
                                <a th:lay-href="${menu2.href}" th:text="${menu2.title}"></a>
                            </dd>
                        </dl>
                    </li>
                </ul>
            </div>
        </div>

        <!-- ===== 页面标签（来自 contentTag） ===== -->
        <div th:replace="contentTag :: tag"></div>

        <!-- ===== 主体内容 ===== -->
        <div class="layui-body" id="LAY_app_body">
            <div class="layadmin-tabsbody-item layui-show">
                <!-- 可以显示欢迎页或个人中心内容，例如加载 /userCenter -->
                <iframe src="/userCenter" frameborder="0" class="layadmin-iframe"></iframe>
            </div>
        </div>

        <!-- 辅助元素 -->
        <div class="layadmin-body-shade" layadmin-event="shade"></div>
    </div>
</div>

<script th:src="@{/layuiadmin/layui/layui.js}"></script>
<script>
    layui.config({
        base: '/layuiadmin/'
    }).extend({
        index: 'lib/index'
    }).use('index');
    window.logout = function() {
        if (!confirm('确定要退出登录吗？')) return;
        fetch('/user/logout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        })
        .then(res => res.json())
        .then(data => {
            if (data.code === 0) {
                window.location.href = '/toLogin';
            } else {
                alert('退出失败：' + data.msg);
            }
        })
        .catch(function() {
            window.location.href = '/toLogin';
        });
    };
</script>
</body>
</html>
