<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>个人中心</title>
    <link rel="stylesheet" th:href="@{/layuiadmin/layui/css/layui.css}" media="all">
</head>
<body>
<div class="layui-card" style="padding:20px; max-width:500px; margin:20px auto;">
    <h2>👤 个人中心</h2>
    <hr>
    <form class="layui-form" lay-filter="profileForm">
        <div class="layui-form-item">
            <label class="layui-form-label">用户名</label>
            <div class="layui-input-block"><input type="text" name="username" disabled class="layui-input"></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">昵称</label>
            <div class="layui-input-block"><input type="text" name="nickname" class="layui-input"></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">邮箱</label>
            <div class="layui-input-block"><input type="email" name="email" class="layui-input"></div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">手机号</label>
            <div class="layui-input-block"><input type="text" name="phone" class="layui-input"></div>
        </div>
        <div class="layui-form-item" style="text-align:center;">
            <button type="button" class="layui-btn" id="saveBtn">保存修改</button>
            <button type="button" class="layui-btn layui-btn-warm" id="changePwdBtn">修改密码</button>
        </div>
    </form>
</div>

<script th:src="@{/layuiadmin/layui/layui.js}"></script>
<script>
    layui.use(['form','layer'], function(){
        var form = layui.form, layer = layui.layer, $ = layui.$;

        // ===== 加载个人信息 =====
        $.get('/user/profile', function(res){
            if(res.code===0){
                form.val('profileForm', res.data);
            } else {
                layer.msg('请先登录', function(){ location.href='/toLogin'; });
            }
        });

        // ===== 保存修改（直接获取输入框值） =====
        $('#saveBtn').click(function(){
            var data = {
                nickname: $('input[name="nickname"]').val(),
                email: $('input[name="email"]').val(),
                phone: $('input[name="phone"]').val()
            };
            $.ajax({
                url: '/user/profile/update',
                type: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function(res){
                    if(res.code===0) {
                        layer.msg('修改成功', {icon:1});
                        // 刷新页面以更新显示
                        location.reload();
                    } else {
                        layer.msg(res.msg, {icon:2});
                    }
                },
                error: function(){
                    layer.msg('请求失败', {icon:2});
                }
            });
        });

        // ===== 修改密码（使用自定义弹窗，支持三个输入框） =====
        $('#changePwdBtn').click(function(){
            // 自定义内容
            var content =
                '<div style="padding:20px;">' +
                '<div style="margin-bottom:15px;">' +
                '<label>原密码：</label>' +
                '<input type="password" id="oldPwd" class="layui-input" style="width:100%;">' +
                '</div>' +
                '<div style="margin-bottom:15px;">' +
                '<label>新密码：</label>' +
                '<input type="password" id="newPwd" class="layui-input" style="width:100%;">' +
                '</div>' +
                '<div style="margin-bottom:15px;">' +
                '<label>确认密码：</label>' +
                '<input type="password" id="confirmPwd" class="layui-input" style="width:100%;">' +
                '</div>' +
                '</div>';

            layer.open({
                type: 1,
                title: '修改密码',
                area: ['400px', '300px'],
                content: content,
                btn: ['确认修改', '取消'],
                yes: function(index){
                    var oldPwd = $('#oldPwd').val();
                    var newPwd = $('#newPwd').val();
                    var confirmPwd = $('#confirmPwd').val();

                    if(!oldPwd || !newPwd || !confirmPwd){
                        layer.msg('请填写完整信息');
                        return;
                    }
                    if(newPwd.length < 6){
                        layer.msg('新密码至少6位');
                        return;
                    }
                    if(newPwd !== confirmPwd){
                        layer.msg('两次密码不一致');
                        return;
                    }

                    // 提交修改密码
                    $.ajax({
                        url: '/user/profile/changePwd',
                        type: 'PUT',
                        data: { oldPwd: oldPwd, newPwd: newPwd },
                        success: function(res){
                            if(res.code===0){
                                layer.msg('密码修改成功，请重新登录', {icon:1}, function(){
                                    window.location.href = '/toLogin';
                                });
                            } else {
                                layer.msg(res.msg, {icon:2});
                            }
                        },
                        error: function(){
                            layer.msg('请求失败', {icon:2});
                        }
                    });
                    layer.close(index);
                },
                btn2: function(index){
                    layer.close(index);
                }
            });
        });
    });
</script>
</body>
</html>
