<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>用户管理</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/layuiadmin/layui/css/layui.css}">
</head>
<body>
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form">
            <div class="layui-inline">
                <input class="layui-input" name="keyword" placeholder="输入用户名/昵称搜索" autocomplete="off">
            </div>
            <button class="layui-btn" lay-submit lay-filter="searchBtn">搜索</button>
            <button type="button" class="layui-btn layui-btn-normal" id="addBtn">添加用户</button>
        </form>
    </div>
    <div class="layui-card-body">
        <table id="userTable" lay-filter="userTable"></table>
    </div>
</div>

<!-- 新增/编辑用户弹窗 -->
<!-- 新增/编辑用户弹窗 -->
<div id="userFormDiv" style="display:none;padding:20px;">
    <form class="layui-form" id="userForm" lay-filter="userForm">
        <input type="hidden" name="id">
        <div class="layui-form-item">
            <label class="layui-form-label">用户名</label>
            <div class="layui-input-block">
                <input name="username" lay-verify="required" class="layui-input" placeholder="请输入用户名">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">密码</label>
            <div class="layui-input-block">
                <input name="password" type="password" class="layui-input" placeholder="新增必填，编辑留空则不修改">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">昵称</label>
            <div class="layui-input-block">
                <input name="nickname" class="layui-input" placeholder="请输入昵称">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">角色</label>
            <div class="layui-input-block">
                <select name="role">
                    <option value="0">普通用户</option>
                    <option value="1">管理员</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-block">
                <input type="radio" name="status" value="1" title="启用" checked>
                <input type="radio" name="status" value="0" title="禁用">
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="layui-btn" lay-submit lay-filter="formSubmit">提交</button>
                <button type="reset" class="layui-btn layui-btn-primary">重置</button>
            </div>
        </div>
    </form>
</div>

<!-- 行操作按钮模板 -->
<script type="text/html" id="operBar">
    <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
    <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
</script>

<script th:src="@{/layuiadmin/layui/layui.js}"></script>
<!-- 关键：加上 th:inline="none"，禁止 Thymeleaf 解析该脚本内的表达式 -->
<script th:inline="none">
    layui.use(['table','form','layer','jquery'], function(){
        var table = layui.table;
        var form = layui.form;
        var layer = layui.layer;
        var $ = layui.jquery;

        // 1. 渲染表格
        table.render({
            elem: '#userTable',
            url: '/user/admin/list',
            page: true,
            cols: [[
                {field:'id', title:'ID', width:80},
                {field:'username', title:'用户名', width:150},
                {field:'nickname', title:'昵称', width:150},
                {field:'role', title:'角色', width:100, templet: function(d){
                    return d.role === 1 ? '管理员' : '普通用户';
                }},
                {field:'status', title:'状态', width:100, templet: function(d){
                    return d.status === 1 ? '启用' : '禁用';
                }},
                {field:'createTime', title:'创建时间', width:180},
                {title:'操作', width:180, toolbar: '#operBar'}
            ]]
        });

        // 2. 搜索
        form.on('submit(searchBtn)', function(data){
            table.reload('userTable', {
                page: { curr: 1 },
                where: { keyword: data.field.keyword }
            });
            return false;
        });

        // 3. 新增按钮
        $('#addBtn').on('click', function(){
            $('#userForm')[0].reset();
            $('input[name="id"]').val('');
            layer.open({
                type: 1,
                title: '新增用户',
                area: ['500px', '480px'],
                content: $('#userFormDiv'),
                success: function(){ form.render(); }
            });
        });

        // 4. 表单提交（新增+编辑共用）
        form.on('submit(formSubmit)', function(data){
            var id = data.field.id;
            var url = id ? '/user/admin/update' : '/user/admin/add';
            var type = id ? 'PUT' : 'POST';

            $.ajax({
                url: url,
                type: type,
                contentType: 'application/json;charset=utf-8',
                data: JSON.stringify(data.field),
                success: function(res){
                    if(res.code === 0){
                        layer.msg('操作成功');
                        layer.closeAll();
                        table.reload('userTable');
                    } else {
                        layer.msg(res.msg || '操作失败');
                    }
                }
            });
            return false;
        });

        // 5. 行内编辑、删除
        table.on('tool(userTable)', function(obj){
            var data = obj.data;
            if(obj.event === 'edit'){
                form.val('userForm', data);
                layer.open({
                    type: 1,
                    title: '编辑用户',
                    area: ['500px', '480px'],
                    content: $('#userFormDiv'),
                    success: function(){ form.render(); }
                });
            } else if(obj.event === 'del'){
                layer.confirm('确定删除该用户？', function(index){
                    $.ajax({
                        url: '/user/admin/delete/' + data.id,
                        type: 'DELETE',
                        success: function(res){
                            if(res.code === 0){
                                layer.msg('删除成功');
                                obj.del();
                                layer.close(index);
                            } else {
                                layer.msg(res.msg || '删除失败');
                            }
                        }
                    });
                });
            }
        });
    });
</script>
</body>
</html>
